name: Storybook Build and Deploy
on:
    push:
        branches: ["main"]
        paths: ["packages/core/**", "packages/cells/**", "packages/source/**", "llms.txt", "README.md", "AGENTS.md", ".github/workflows/storybook.js.yml"]
    workflow_dispatch:
permissions:
    contents: write
jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20.10.0
            - name: Install and Build 🔧
              run: |
                  npm install
                  npm run build-storybook
            - name: "Add .nojekyll + machine-readable docs 📄"
              run: |
                  cd storybook-build && touch .nojekyll && cd ..
                  cp packages/core/API.md llms.txt storybook-build/
                  { cat README.md; printf '\n\n---\n\n'; cat packages/core/API.md; printf '\n\n---\n\n'; cat AGENTS.md; } > storybook-build/llms-full.txt
            - name: Deploy 🚀
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  branch: gh-pages
                  folder: storybook-build
                  target-folder: docs
                  clean: true
