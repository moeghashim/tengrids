name: Visual regression
on:
    push:
        branches: ["main"]
    pull_request:
    workflow_dispatch:
        inputs:
            update_snapshots:
                description: "Regenerate the baselines and commit them"
                type: boolean
                default: false
permissions:
    contents: write
jobs:
    visual:
        runs-on: ubuntu-latest
        # Same image as `npm run visual:docker`, so local and CI pixels match.
        container: mcr.microsoft.com/playwright:v1.62.1-noble
        steps:
            - uses: actions/checkout@v4
            - name: Install and build Storybook
              run: |
                  npm install
                  npm run build -w packages/core
                  npx storybook build -o storybook-build
            - name: Screenshot stories
              if: ${{ !inputs.update_snapshots }}
              run: npx playwright test
            - name: Regenerate baselines
              if: ${{ inputs.update_snapshots }}
              run: |
                  npx playwright test --update-snapshots
                  git config --global --add safe.directory "$GITHUB_WORKSPACE"
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add visual/__snapshots__
                  git diff --cached --quiet || git commit -m "Update visual regression baselines"
                  git push
            - name: Upload report on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report
                      test-results
                  retention-days: 14
